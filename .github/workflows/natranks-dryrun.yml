name: natranks dry run (fetch + parse only)
# Dry run for "How {Team} ranks nationally": fetch NCAA.com, parse, gate, upload ranks.json as an artifact.
# Never commits, never deploys, no secrets. Separate from refresh.yml.
on:
  workflow_dispatch:
  push:
    branches: [natranks-dryrun]
permissions:
  contents: read
concurrency: { group: natranks-dryrun, cancel-in-progress: false }
jobs:
  ranks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Runner IP (egress)
        run: curl -s -m 10 https://api.ipify.org || true
      - name: Fetch + parse + gates
        run: python3 natranks/build_ranks.py --teams natranks/teams-ref.json --out out/ranks.json --cache out/pages
      - name: Check 138 teams x 9 cats
        run: python3 -c "import json;d=json.load(open('out/ranks.json'));assert len(d['t'])==138 and len(d['cats'])==9 and all(c['n']>=130 for c in d['cats']);print('OK',len(d['t']),[c['n'] for c in d['cats']],d['thru'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ranks-json, path: out/, retention-days: 7, if-no-files-found: warn }
