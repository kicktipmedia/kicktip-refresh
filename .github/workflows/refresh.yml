name: refresh
# KickTip data refresh on GitHub's runners. tools/auto_refresh.sh skips (exit 0) when no final/score/kickoff changed.
# Guard: Production deploy only if Cloudflare's canonical deployment == state.json live_id (feature builds deploy from the box
# and must run tools/publish_base.sh afterwards). FREEZE file in the repo root stops all deploys.
on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "production | preview (branch refresh-gh, no Production) | none (dry run)"
        type: choice
        options: [production, preview, none]
        default: production
      force:
        description: "run even if no result changed"
        type: boolean
        default: false
      inputs_run:
        description: "replay the frozen ESPN inputs of this earlier run id (no fetch)"
        type: string
        default: ""
  schedule:
    # UTC. Saturday game window (about 10 AM to 1 AM MT): every 30 min. A full run is ~65 min; concurrency keeps one running + at most one pending (newer ticks replace the pending one), so the effective Saturday cadence is back-to-back full runs
    - cron: "*/30 16-23 * * 6"
    - cron: "*/30 0-7 * * 0"
    # rest of the week: hourly
    - cron: "7 8-23 * * 0"
    - cron: "7 * * * 1-5"
    - cron: "7 0-15 * * 6"
concurrency:
  group: refresh
  cancel-in-progress: false
# public repo: only manual + schedule triggers (no pull_request / pull_request_target); secrets only in the two steps that deploy
permissions:
  contents: read
jobs:
  refresh:
    # scheduled runs only when repo variable KT_SCHEDULE=on (gh variable set KT_SCHEDULE --body off  to pause)
    if: github.event_name != 'schedule' || vars.KT_SCHEDULE == 'on'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # release 'base' upload + state.json commit
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      KT_ROOT: ${{ github.workspace }}
      KT_RELATIVE: "1"
      KT_PREVIEW_BRANCH: refresh-gh
      KT_WRANGLER: /home/runner/wr/node_modules/.bin/wrangler
      KT_WRANGLER_DIR: /home/runner/wr
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v4
      - name: Stop if frozen
        run: if [ -e FREEZE ]; then echo "FREEZE present:"; cat FREEZE; exit 1; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: tools/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "20.19.2" }
      - name: Fetch base (live zip + S0) and check sha
        run: tools/fetch_base.sh
      # National ranks (NCAA.com): last-good cache, fetch at most once per 20 h, fallback to last good; never fails the run
      - name: National ranks cache (restore last good)
        uses: actions/cache/restore@v4
        with: { path: natranks/last, key: "natranks-${{ github.run_id }}", restore-keys: "natranks-" }
      - name: National ranks (fetch cap 20h, last-good fallback)
        id: ranks
        continue-on-error: true
        run: tools/ranks_step.sh
      - name: National ranks cache (save after a fresh fetch)
        if: steps.ranks.outputs.ranks_fresh == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with: { path: natranks/last, key: "natranks-${{ github.run_id }}" }
      - name: Pull ESPN and decide (cheap gate)
        id: gate
        run: |
          if [ -n "${{ inputs.inputs_run }}" ]; then
            gh run download "${{ inputs.inputs_run }}" -n "inputs-${{ inputs.inputs_run }}" -D /tmp/inp && tar xzf $(ls /tmp/inp/*/inputs.tgz) -C tree
            if [ ! -e tree/data/out/refresh_log.json ]; then gh run download "${{ inputs.inputs_run }}" -n "run-${{ inputs.inputs_run }}" -D /tmp/runart && mkdir -p tree/data/out && cp $(ls /tmp/runart/runs/*/refresh.json | head -n 1) tree/data/out/refresh_log.json; fi
            echo "KT_SKIP_FETCH=1" >> $GITHUB_ENV; echo "changed=1" >> $GITHUB_OUTPUT; echo "replaying inputs of run ${{ inputs.inputs_run }}"; exit 0
          fi
          python3 -m pip install -q numpy==2.5.4
          cd tree && python3 src/refresh.py > /tmp/refresh.json && cd ..
          FP=$(python3 tools/results_fp.py tree | cut -d' ' -f1); OLD=$(python3 -c "import json;print(json.load(open('state.json'))['results_fp'])")
          echo "fp $OLD -> $FP"
          if [ "$FP" = "$OLD" ] && [ "${{ inputs.force }}" != "true" ]; then
            if [ "${{ steps.ranks.outputs.ranks_changed }}" = "1" ]; then echo "changed=1" >> $GITHUB_OUTPUT; echo "ranks_only=1" >> $GITHUB_OUTPUT; echo "Results unchanged; national ranks changed: run." >> $GITHUB_STEP_SUMMARY
            else echo "changed=0" >> $GITHUB_OUTPUT; echo "No new final/score/kickoff: skip." >> $GITHUB_STEP_SUMMARY; fi
          else echo "changed=1" >> $GITHUB_OUTPUT; fi
          git checkout -- tree/data/store
      - name: Install tools (pinned)
        if: steps.gate.outputs.changed == '1'
        run: |
          python3 -m pip install -q -r tools/requirements.txt
          python3 -m playwright install --with-deps chromium > /dev/null
          mkdir -p $KT_WRANGLER_DIR && cd $KT_WRANGLER_DIR && echo '{}' > package.json && npm i -s --no-audit --no-fund wrangler@3.114.17
      - name: Refresh
        if: steps.gate.outputs.changed == '1'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          A=""; case "${{ inputs.deploy_target || 'production' }}" in preview) A="--preview-only";; none) A="--no-deploy";; esac
          [ "${{ inputs.force }}" = "true" ] && A="$A --force"
          [ "${{ steps.gate.outputs.ranks_only }}" = "1" ] && A="$A --force"
          export KT_RANKS="${{ steps.ranks.outputs.ranks_out }}"
          tools/auto_refresh.sh $A
      - name: Record new live base
        if: steps.gate.outputs.changed == '1' && (inputs.deploy_target || 'production') == 'production'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          R=$(ls -d runs/* | tail -n 1)/result.json; cat $R
          if python3 -c "import json,sys;sys.exit(0 if 'live_id' in json.load(open('$R')) else 1)"; then
            git checkout -- state.json
            eval "$(python3 -c "import json,shlex;r=json.load(open('$R'));print('ZIP=%s ID=%s S0=%s ASOF=%s FP=%s DONE=%s'%tuple(shlex.quote(str(r[k])) for k in ('zip','live_id','s0','as_of','fp','completed')))")"
            tools/publish_base.sh "$ZIP" "$ID" --s0 "$S0" --as-of "$ASOF" --fp "$FP" --completed "$DONE"
          fi
      - name: Commit FREEZE if a post-deploy check failed
        if: failure()
        run: |
          if [ -e FREEZE ] && ! git ls-files --error-unmatch FREEZE >/dev/null 2>&1; then
            git add FREEZE && git -c user.name=kicktipmedia -c user.email=kicktipmedia@users.noreply.github.com commit -m "FREEZE after failed post-deploy check" && git pull --rebase && git push; fi
      - name: Keep fetched ESPN inputs (box replay with KT_SKIP_FETCH=1)
        if: always() && steps.gate.outputs.changed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: inputs-${{ github.run_id }}
          retention-days: 7
          path: runs/*/inputs.tgz
      - name: Keep run logs
        if: always() && steps.gate.outputs.changed == '1'
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          retention-days: 14
          path: |
            runs/*/*.log
            runs/*/*.txt
            runs/*/*.json
            tree/data/out/run_meta.json
            runs/*/crops-*/*-top.png
